# Agentic merge check suite — named jobs for branch protection.
#
# This workflow produces separate, individually-addressable status checks
# so that GitHub branch protection can require only the blocking checks
# while showing advisory checks without blocking merge.
#
# Required status checks (blocking):
#   typecheck, build, tests, ADR validation, PRD validation, policy scan,
#   secret guard
#
# Advisory (not required by branch protection):
#   lint, coverage
#
# See ADR-0023 and docs/branch-protection-policy.md for the full policy.
#
# Note: the MVP single-job check.yml (which ran `npm run check` end-to-end)
# was split into separate jobs so branch protection can selectively require
# individual checks. The combined `npm run check` script is still available
# for local development and ad-hoc runs.

name: check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_FILE: .nvmrc
  # Reuse a shared cache key across all jobs in this workflow run.
  CACHE_KEY: npm-ci-${{ hashFiles('package-lock.json') }}

# Shared setup for all jobs — avoids repeating node setup.
# We use a matrix per job so each produces its own status check name.
jobs:

  # ─── Blocking checks ───────────────────────────────────────────────────

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  adr-validation:
    name: ADR validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ADR validation
        run: npm run validate:adrs

  prd-validation:
    name: PRD validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PRD validation
        run: npm run validate:prds

  policy-scan:
    name: policy scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run policy scan
        run: npm run policy-scan

  secret-guard:
    name: secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run secret guard (tracked files)
        run: npm run secret-guard:tracked

  # ─── Advisory checks ───────────────────────────────────────────────────

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory check — does not block merge. Continues on failure so PR
    # status is informational, not blocking.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [tests]
    # Advisory check — does not block merge. Continues on failure.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

  # ─── Summary job (optional — aggregates status for PR comments) ────────

  check-summary:
    name: check summary
    runs-on: ubuntu-latest
    needs:
      [typecheck, build, tests, adr-validation, prd-validation,
       policy-scan, secret-guard, lint, coverage]
    # Always run even if upstream jobs fail, so the PR shows a status.
    if: always()
    steps:
      - name: Aggregate check results
        run: |
          echo "## Check Suite Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Helper: map job result to emoji + label.
          result_label() {
            case "$1" in
              success)   echo "✅ pass";;
              failure)   echo "❌ fail";;
              cancelled) echo "🟡 cancelled";;
              skipped)   echo "⚪ skipped";;
              *)         echo "❓ unknown ($1)";;
            esac
          }

          # Blocking checks — all must pass.
          echo "### Blocking checks" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for job in typecheck build tests adr-validation prd-validation policy-scan secret-guard; do
            status="${{ needs.$job.result }}"
            echo "| $job | $(result_label $status) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Advisory checks.
          echo "### Advisory checks" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for job in lint coverage; do
            status="${{ needs.$job.result }}"
            echo "| $job | $(result_label $status) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Overall verdict.
          blocking_ok=true
          for job in typecheck build tests adr-validation prd-validation policy-scan secret-guard; do
            if [ "${{ needs.$job.result }}" != "success" ]; then
              blocking_ok=false
              break
            fi
          done
          if $blocking_ok; then
            echo "**Verdict: All blocking checks passed. Ready to merge.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Verdict: Some blocking checks failed. Merge blocked.**" >> "$GITHUB_STEP_SUMMARY"
          fi
